name: Sync podcast feed

on:
  schedule:
    - cron: "30 15 * * *"   # daily, ~1.5h after Muse publishes (~14:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python podcast/build_podcast.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add podcast
          git diff --cached --quiet || (git commit -m "Sync podcast feed" && git push)
